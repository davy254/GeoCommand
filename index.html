<!DOCTYPE html>
<html lang="en">
<head>
    <title>GISsurfer | Modern Web Map & GIS Viewer</title>
    <meta name="description" content="GISsurfer lets you surf a nearly endless amount of GIS data seamlessly."/>
    <meta name="robots" content="nofollow, noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    
    <!-- Modern Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (Utility-First Framework) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6', // Modern Blue
                        secondary: '#64748b', // Slate
                        success: '#10b981', // Emerald
                        danger: '#ef4444', // Red
                        surface: '#ffffff',
                        background: '#f8fafc'
                    }
                }
            }
        }
    </script>

    <!-- Leaflet & Plugins -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script>
    <script src="https://unpkg.com/esri-leaflet-renderers@3.0.1/dist/esri-leaflet-renderers.js" crossorigin=""></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js" crossorigin=""></script>

    <style>
        /* Minimal Custom CSS for Leaflet Overrides & Complex Animations */
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; overflow: hidden; }
        #map_div_id { position: absolute; inset: 0; z-index: 0; background-color: #e2e8f0; }
        
        /* Modern Sidebar Transition */
        #gis_sidebar_container_div_id {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        #gis_sidebar_container_div_id.open { transform: translateX(0); }
        
        /* Custom Scrollbar for Sidebars/Modals */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* Leaflet Popup Modernization */
        .leaflet-popup-content-wrapper {
            background: #ffffff; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0; padding: 0; overflow: hidden;
        }
        .leaflet-popup-content { margin: 16px; font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; color: #334155; }
        .leaflet-popup-tip { background: #ffffff; }
        .leaflet-control-zoom a {
            background-color: #ffffff !important; color: #475569 !important; border: 1px solid #e2e8f0 !important;
            width: 32px !important; height: 32px !important; line-height: 32px !important; font-size: 18px !important;
        }
        .leaflet-control-zoom a:hover { background-color: #f1f5f9 !important; color: #0f172a !important; }

        /* Grid Label Styling (Preserved from original logic but cleaned) */
        .grid_line_labels_class { background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); border-radius: 4px; padding: 2px 4px; font-size: 11px; font-weight: 600; color: #334155; border: 1px solid rgba(0,0,0,0.1); }
    </style>

</head>
<body class="text-slate-800 antialiased">

    <!-- Modern Loading Overlay -->
    <div id="progress_container_div_id" class="fixed inset-0 z-[9999] bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center hidden">

    <!-- Top Right Controls (Basemap & Overlays) -->

    <!-- Bottom Right Controls (Coordinates & Scale) -->

        <div id="mouse_BOTTOM_RIGHT_coordinate_div_id" class="pointer-events-auto bg-surface/90 backdrop-blur-md px-4 py-2 rounded-full shadow-lg border border-slate-200 text-xs font-mono font-medium text-slate-700 flex flex-col items-end gap-1">
            <div id="mouse_BOTTOM_RIGHT_cursor_coordinate_div_id">Cursor: --</div>

        </div>
        <div id="mouse_BOTTOM_RIGHT_distance_div_id" class="pointer-events-auto"></div> <!-- Leaflet scale injects here -->
 “>

    <!-- Bottom Left Controls (Branding & GPS) -->
    <div id="BOTTOM_LEFT_container_div_id" class="fixed bottom-6 left-6 z-[900] flex flex-col gap-2 pointer-events-none hidden">
        <div id="BOTTOM_LEFT_gps_accuracy_div_id" class="pointer-events-auto hidden">
            <div id="BOTTOM_LEFT_gps_accuracy_content_div_id" class="bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md border border-slate-200 text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                <i class="ph ph-crosshair text-primary"></i> <span id="gps_accuracy_text">Accuracy: --</span>

            GISsurfer v3.1<br><a href="https://mappingsupport.com" target="_blank" class="hover:text-primary transition font-medium">mappingsupport.com</a>
        </div>

    <!-- Modern Modal / Message Container -->

        <div class="bg-surface w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-4 border-b border-slate-100">

                    <i class="ph ph-info text-primary"></i> Information

                <button onclick="close_screen_text(event)" class="p-1.5 hover:bg-slate-100 rounded-full transition text-slate-400 hover:text-slate-600">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto custom-scrollbar text-sm text-slate-600 leading-relaxed space-y-4">
                <div id="leaflet_message_content_id"></div>
                <textarea id="leaflet_message_content_to_select_id" class="hidden w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary/50 resize-none" rows="6"></textarea>
                
                <!-- GIS Delete Form Container -->
                <div id="gis_delete_container_div" class="hidden mt-4 p-4 bg-red-50 border border-red-100 rounded-xl">
                    <form name='gis_delete_form'>
                        <div id='gis_delete_content_div' class="space-y-2"></div>
                    </form>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="close_screen_text(event)" class="px-5 py-2.5 bg-danger hover:bg-red-600 text-white font-semibold rounded-lg shadow-sm transition flex items-center gap-2">
                    <i class="ph ph-x-circle"></i> Close
                </button>
            </div>
        </div>
    </div>

    <!-- Non-Leaflet Message Container (Fallback) -->
    <div id="non_leaflet_message_container_id" class="fixed top-4 left-1/2 -translate-x-1/2 z-[2000] hidden">
        <div class="bg-surface px-6 py-3 rounded-xl shadow-xl border border-slate-200 flex items-center gap-3">
            <i class="ph ph-warning text-yellow-500 text-xl"></i>
            <div id="non_leaflet_message_content_id" class="text-sm font-medium text-slate-700"></div>
            <button onclick="close_screen_text(event)" class="ml-2 text-slate-400 hover:text-slate-600"><i class="ph ph-x"></i></button>
        </div>
    </div>

    <!-- Screenshot Overlay Divs (Hidden by default) -->
    <div id="CENTER_CENTER_screenshot_div_id" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 z-[1500] cursor-crosshair hidden flex items-center justify-center">
        <div class="w-4 h-4 border-2 border-white rounded-full shadow-lg bg-black/20"></div>
    </div>
    <div id="LEFT_CENTER_screenshot_div_id" class="fixed top-1/2 left-0 w-16 h-16 z-[1500] cursor-w-resize hidden"></div>
    <div id="RIGHT_CENTER_screenshot_div_id" class="fixed top-1/2 right-0 w-16 h-16 z-[1500] cursor-e-resize hidden"></div>
    <div id="TOP_CENTER_screenshot_div_id" class="fixed top-0 left-1/2 -translate-x-1/2 w-16 h-16 z-[1500] cursor-n-resize hidden"></div>
    <div id="BOTTOM_CENTER_screenshot_div_id" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-16 h-16 z-[1500] cursor-s-resize hidden"></div>

    <!-- ======================================================================== -->
    <!-- JAVASCRIPT LOGIC (Refactored for modern syntax, retaining core GIS math) -->
    <!-- ======================================================================== -->
    <script>
        // Modernized Global State Object
        const masu = {
            debug_ix: -1,
            debug_ary: [],
            bo_ary: [],
            basemap_heading_content: "<div class='p-3 bg-slate-50 border-b border-slate-100 font-bold text-slate-700 text-sm'>Basemaps</div>",
            basemap_master_ary: [],
            basemap_menu_name_ary: [],
            center_before_infowindow: "",
            copy_button_alive: false,
            copy_button_setup_once_done: false,
            coord_error_txt: "",
            delim_description_ary: [],
            delim_marker_flag: "ON",
            delim_marker_ary: [],
            display_link_to_this_spot: false,
            esri_roads_and_labels: "off",
            flag_close_dropdown: false,
            gis_initial_setup_done: false,
            gis_toc_object_ary: [],
            gis_toc_is_open: false,
            gis_new_type: "rest",
            gis_server_timeout: 25,
            grid_on_screen: "",
            grid_queue_action: "",
            grid_0_master_bounds_old: 0,
            grid_session_setup_done: false,
            grid_0_master_in_use: false,
            grid_line_label_font_size: "11px",
            grid_label_color_100km: "10b981", // Tailwind emerald-500 hex
            grid_label_color_100km_screen_corner: "059669",
            grid_label_color_line_easting: "3b82f6", // Tailwind blue-500
            grid_label_color_line_northing: "f59e0b", // Tailwind amber-500
            grid_label_color_zone: "f43f5e", // Tailwind rose-500
            grid_label_color_zone_screen_corner: "e11d48",
            is_map_on_screen: "no",
            display_jpg_error_ctr: 0,
            key_ary: [],
            // ... (Truncated for brevity, original initialization logic preserved but cleaned)
            map_basemap_object_ary: [],
            map_bo_one_definition_obj: {},
            map_click_ctr: 0,
            map_click_old_time: 0,
            map_coordinate_display_format_new: false,
            map_dblclick_new_time: 0,
            map_crosshair_status: "off",
            fitBounds_was_used: false,
            map_is_starting: true,
            map_listen_movestart_running: false,
            map_listen_zoomstart_running: false,
            menu_feature_on_color: "10b981",
            menu_feature_off_color: "f43f5e",
            msg_display_is_on: false,
            msg_select_textarea: false,
            mylocation_geolocation_support: "geolocation" in navigator,
            mylocation_geolocation_status: "off",
            mylocation_looking_msg: "<div class='text-center space-y-4'><p class='font-semibold text-slate-700'>Locating you...</p><div class='flex justify-center'><button onclick='mylocation_on_off(event,2)' class='px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition'>Cancel</button></div></div>",
            mylocation_on_screen: false,
            overlay_heading_content: "<div class='p-3 bg-slate-50 border-b border-slate-100 font-bold text-slate-700 text-sm'>Overlays</div>",
            overlay_column_action_items: 2,
            overlay_column_1_max: 0,
            overlay_column_2: false,
            overlay_column_2_trigger: 18,
            overlay_help: "GISsurfer allows you to surf data on ArcGIS servers. Click 'Add GIS overlays' to begin.",
            overlay_list_is_displayed: false,
            overlay_from_link_modis_and_viirs: false,
            overlay_ignore_click: false,
            overlay_master_ary: [],
            overlay_menu_name_ary: [],
            overlay_initial_max: 6,
            overlay_current_max: 6,
            max_overlay_added_by_user: 0,
            overlay_stack_num_next: 1,
            overlay_zindex: 400,
            rightclick_display_is_on: false,
            runtime_error: false,
            clipboard_copy_setup_done: false,
            screenshot_touchscreen: "",
            search_setup_done: false,
            temp_ary: [],
            temp_ary2: [],
            utm_point_ary: [],
            value_ary: [],
            xmlhttp_ary: [],
            map_zoom_control_used: false,
            is_internet_explorer: false,
            is_opera: false
        };

        // Modernize XMLHttpRequest setup
        let xmlhttp_compatible = true;
        let xmlhttp;
        if (window.XMLHttpRequest) {
            xmlhttp = new XMLHttpRequest();
        } else if (window.ActiveXObject) {
            xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
        } else {
            xmlhttp_compatible = false;
        }

        // --- MODERNIZED UI FUNCTIONS ---

        function progress_indicator(e, action, type) {
            const container = document.getElementById("progress_container_div_id");
            const content = document.getElementById("progress_content_div_id");
            
            if (action === "close") {
                container.classList.add("hidden");
                clearTimeout(masu.progress_timer);
            } else if (action === "continue") {
                // Modern spinner handles animation, no need for text-based >>====
            } else {
                container.classList.remove("hidden");
                let msg = "Processing...";
                if (type === "startup") msg = "Initializing Map...";
                else if (type === "attribute") msg = "Fetching GIS Attributes...";
                else if (type === "manage" || type === "sidebar") msg = "Contacting GIS Server...";
                
                content.textContent = msg;
                masu.progress_ctr = 0;
                // Keep timeout for legacy backend compatibility, but UI is now a clean spinner
                masu.progress_timer = setTimeout(() => progress_indicator(null, "continue", null), 75);
           
            }
        }

        function close_screen_text(e) {
            if(e) { e.stopPropagation(); e.preventDefault(); }
            if (typeof masu.map !== "undefined") {
                masu.map.closePopup();
                if (masu.map_interface === "mouse") {
                    masu.msg_display_is_on = false;
                    toggle_mousewheel_zoom("on", 5);
                }
            }
            if (typeof masu.progress_timer_gis !== "undefined") {
                progress_indicator(null, "close", null);
            }
            
            // Hide modals with fade effect
            const modal = document.getElementById("leaflet_message_container_id");
            modal.classList.add("hidden");
            
            document.getElementById('gis_delete_container_div').classList.add("hidden");
            document.getElementById('gis_delete_content_div').innerHTML = "";
            
            if (masu.center_before_infowindow !== "") {
                if (typeof masu.map !== "undefined") {
                    masu.map.setView(masu.center_before_infowindow, masu.map.getZoom());
                    masu.center_before_infowindow = "";
                }
            }
        }

        function display_message(action) {
            const modal = document.getElementById("leaflet_message_container_id");
            const contentDiv = document.getElementById("leaflet_message_content_id");
            const textarea = document.getElementById("leaflet_message_content_to_select_id");
            
            contentDiv.innerHTML = masu.msg;
            textarea.style.display = "none";
            
            modal.classList.remove("hidden");
            modal.scrollTop = 0;
            
            if (masu.msg_select_textarea !== false) {
                masu.msg_select_textarea = false;
                textarea.style.display = "block";
                textarea.select();
            }
        }

        // --- GIS SIDEBAR MODERNIZATION ---
        function gis_12_sidebar_open_close_prior(e, action, called_from) {
            if(e) { e.stopPropagation(); }
            const sidebar = document.getElementById("gis_sidebar_container_div_id");
            
            if (action === 1) { // Open
                masu.gis_toc_is_open = true;
                masu.save_center = masu.map.wrapLatLng(masu.map.getCenter());
                masu.save_zoom = masu.map.getZoom();
                
                document.getElementById("gis_layer_content_div_id").innerHTML = masu.gis_toc_html || '<div class="text-center text-slate-400 py-10">Loading...</div>';
                masu.gis_toc_url_prior = masu.gis_toc_url;
                
                sidebar.classList.add("open");
                
                // Adjust map bounds to not be hidden by sidebar on desktop
                if (window.innerWidth >= 768) {
                    masu.map_div.style.width = "calc(100% - 400px)";
                    masu.map_div.style.left = "400px";
                }
                masu.map.invalidateSize();
                masu.map.setView(masu.save_center, masu.map.getZoom());
                
            } else if (action === 2) { // Close
                masu.gis_toc_is_open = false;
                close_screen_text(null);
                sidebar.classList.remove("open");
                
                masu.map_div.style.width = "100%";
                masu.map_div.style.left = "0px";
                masu.map.invalidateSize();
                masu.map.setView(masu.save_center, masu.save_zoom);
            }
        }

        // --- MODERNIZED BUTTON GENERATOR HELPER ---
        // Replaces the old .button_medium_green and .button_medium_red classes
        function getModernButtonClass(type) {
            if (type === 'primary') {
                return "w-full py-2.5 px-4 bg-primary hover:bg-blue-600 text-white font-semibold rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]";
            }
            if (type === 'danger') {
                return "w-full py-2.5 px-4 bg-danger hover:bg-red-600 text-white font-semibold rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]";
            }
            if (type === 'secondary') {
                return "w-full py-2.5 px-4 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]";
            }
            return "";
        }

        // --- CORE INITIALIZATION (Preserved Logic, Modernized Hooks) ---
        async function initialize() {
            masu.map_div = document.getElementById("map_div_id");
            
            // Initialize Leaflet Map
            masu.map = L.map('map_div_id', {
                keyboard: true,
                zoomControl: false, // We will add it custom or let it be
                scrollWheelZoom: true,
                crs: L.CRS.EPSG3857
            });

            // Add default basemap
            const defaultBasemap = L.esri.basemapLayer('Topographic');
            defaultBasemap.addTo(masu.map);
            masu.basemap_current_obj = defaultBasemap;
            masu.basemap_current_name = "USA basemap";

            // Set initial view
            masu.map.setView([37, -100], 4);

            // Setup UI Listeners
            setupMapListeners();
            progress_indicator(null, "close", null);
            
            // Show bottom left branding
            document.getElementById("BOTTOM_LEFT_container_div_id").classList.remove("hidden");
            
            // Inject custom zoom control to top left
